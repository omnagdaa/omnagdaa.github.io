baseURL: https://omnagdaa.github.io/
locale: en-us
defaultContentLanguage: en
title: Om Nagda
enableRobotsTXT: true
enableGitInfo: true
hasCJKLanguage: false

module:
  imports:
    - path: github.com/imfing/hextra

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    lineNos: true
    codeFences: true
    guessSyntax: true
    style: github-dark

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]

menu:
  main:
    - name: Projects
      pageRef: /projects
      weight: 1
    - name: Writeups
      pageRef: /blog
      weight: 2
    - name: Notes
      pageRef: /docs
      weight: 3
    - name: About
      pageRef: /about
      weight: 4
    - name: Search
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: https://github.com/omnagdaa
      params:
        icon: github
    - name: Background motion
      weight: 7
      params:
        type: motion-toggle
    - name: Theme
      weight: 8
      params:
        type: theme-switch

  # Re-add once static/resume.pdf exists:
  # sidebar:
  #   - identifier: resume
  #     name: "Résumé ↗"
  #     url: /resume.pdf
  #     weight: 1

params:
  description: >-
    Security engineering and DevOps — memory forensics, mobile security,
    tooling, and infrastructure automation.

  # Social preview card. Hugo's opengraph template falls back to this for any
  # page without its own image, so every shared link renders a real card
  # instead of a blank one. Regenerate with ./site ogcard.
  images:
    - og-card.png

  # Drives the JSON-LD Person block in _partials/custom/head-end.html.
  author:
    name: Om Nagda
    jobTitle: Security Engineer & DevOps
    email: omnagdaa@proton.me
    # Add `locality:` / `country:` here to surface a location in search filters.
    profiles:
      - https://github.com/omnagdaa
      - https://www.linkedin.com/in/omnagdaa/

  hero:
    prompt: whoami
    title: Om Nagda
    # Shown directly under the name. Kept in step with author.jobTitle, which
    # is what the JSON-LD and the social card both use.
    role: Security Engineer & DevOps
    lede: >-
      Security engineer working across memory forensics, mobile security, and
      the DevOps side of shipping tooling — building the analysis software I
      wanted to exist.
    actions:
      - name: View Projects
        url: /projects/
        primary: true
      - name: Read Writeups
        url: /blog/
    # Contact rail under the buttons. Recruiters land here first, so the route
    # to reach you is on the landing page, not one click away in About.
    contact:
      - name: Email
        url: mailto:omnagdaa@proton.me
        icon: mail
      - name: GitHub
        url: https://github.com/omnagdaa
        icon: github
      - name: LinkedIn
        url: https://www.linkedin.com/in/omnagdaa/
        icon: linkedin

  navbar:
    # Name is dropped from the bar; the logo stays so the "click to go home"
    # affordance survives. Hextra keeps it a link either way.
    displayTitle: false
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 24
      height: 24

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
    width: normal

  theme:
    default: system
    # Hextra's built-in dropdown is replaced by the navbar theme-switch button.
    displayToggle: false

  editURL:
    enable: false

  blog:
    list:
      displayTags: true
