{{- $projects := where site.RegularPages "Section" "projects" -}}
{{- $projects = first 6 (sort $projects "Params.weight") -}}
{{- with $projects }}
<section class="p-section" aria-labelledby="projects-title">
  <div class="p-wrap">
    <div class="p-section-head">
      <div>
        <span class="p-eyebrow" aria-hidden="true" translate="no">// projects</span>
        <h2 class="p-section-title" id="projects-title">Things I&rsquo;ve Built</h2>
      </div>
      <a class="p-link-more" href="{{ "projects/" | relURL }}">All Projects</a>
    </div>

    <div class="p-grid">
      {{- range . }}
        {{ partial "portfolio/project-card.html" . }}
      {{- end }}
    </div>
  </div>
</section>
{{- end }}
