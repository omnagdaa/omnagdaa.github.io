{{- $projects := where site.RegularPages "Section" "projects" -}}
{{- $projects = first 6 (sort $projects "Params.weight") -}}
{{- with $projects }}
<section class="p-section" aria-labelledby="projects-title">
  <div class="p-wrap">
    <div class="p-box">
      <h2 class="p-box-title" id="projects-title">WORK</h2>

      <div class="p-grid">
        {{- range . }}
          {{ partial "portfolio/project-card.html" . }}
        {{- end }}
      </div>

      <p class="p-section-foot"><a class="p-link-more" href="{{ "projects/" | relURL }}">All projects</a></p>
    </div>
  </div>
</section>
{{- end }}
