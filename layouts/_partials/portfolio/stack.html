{{- with site.Data.stack }}
<section class="p-section" aria-labelledby="stack-title">
  <div class="p-wrap">
    <div class="p-box">
      <h2 class="p-box-title" id="stack-title">TOOLING</h2>

      <div class="p-stack-grid">
        {{- range .groups }}
          <div class="p-stack-group">
            <h3>{{ .name }}</h3>
            <ul class="p-stack-list">
              {{- range .items }}
                <li><span class="p-tag">{{ . }}</span></li>
              {{- end }}
            </ul>
          </div>
        {{- end }}
      </div>
    </div>
  </div>
</section>
{{- end }}
